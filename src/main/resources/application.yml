# Settings shared by every environment. Anything environment-specific — above all credentials —
# belongs in the profile files, never here.
spring:
  application:
    name: fin-dashboard
  profiles:
    default: local

  jpa:
    # Flyway owns the schema. Hibernate only checks the entities still match it, so a migration
    # that drifts from the mapping fails at startup instead of at the first query.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        # Spring Boot 4 ships Jackson 3, where this feature moved from SerializationFeature to
        # DateTimeFeature. Timestamps go out as ISO-8601 strings, not epoch numbers.
        write-dates-as-timestamps: false

dashboard:
  web:
    cors:
      # Browser access to the REST API. Public market data and no authentication, so the default is
      # as open as the API itself; narrow allowed-origins when a deployment needs it. Origins are
      # matched as patterns, so a restricted list still works if credentials are ever turned on.
      path-pattern: /api/v1/**
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET,POST,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      # POST /portfolios answers 201 with nothing but a Location header; a browser cannot read it
      # cross-origin unless it is exposed here.
      exposed-headers: Location
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
      max-age-seconds: 3600

  quotes:
    yahoo:
      # Upstream calls are made on request threads, so this timeout bounds how long a quote request
      # can hang. Applied to the connect and to each individual call, including the cookie/crumb
      # handshake the quote endpoint requires.
      connection-timeout-millis: ${QUOTES_TIMEOUT_MS:10000}

    history:
      # How much past price data GET /api/v1/stocks/quotes?history=true answers with, counted in
      # trading days: a five-day window asked for on a Monday still returns five closes rather than
      # the two that fall in the last five calendar days.
      #
      # It is configuration and not a request parameter on purpose. History is fetched one upstream
      # call per ticker, so how much of it this deployment buys is an operator's decision, not a
      # caller's. The live feed never fetches history at all and is unaffected by this setting.
      days: ${QUOTES_HISTORY_DAYS:5}

    stream:
      # The realtime feed. One tick fetches the union of every connected client's symbols in a
      # single upstream call, so the cost is set by this interval, not by how many clients there
      # are. Nothing is fetched at all while nobody is subscribed.
      path: /ws/quotes
      interval-millis: ${QUOTES_STREAM_INTERVAL_MS:3000}
      # Public market data, no credentials: the feed is as open as the REST API. Narrow this when a
      # deployment needs it.
      allowed-origins: ${QUOTES_STREAM_ALLOWED_ORIGINS:*}
      # A client that stops reading is disconnected rather than allowed to back the feed up.
      send-time-limit-millis: 5000
      send-buffer-size-bytes: 524288

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are produced by GlobalExceptionHandler as RFC 9457 documents; the servlet container's
    # own error page must never add stack traces or messages of its own.
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  application:
    name: ${spring.application.name}
    description: Financial stock portfolio dashboard API

logging:
  level:
    root: INFO
    com.forinvest.dashboard: INFO
