# Settings shared by every environment. Anything environment-specific — above all credentials —
# belongs in the profile files, never here.
spring:
  application:
    name: fin-dashboard
  profiles:
    default: local

  jpa:
    # Flyway owns the schema. Hibernate only checks the entities still match it, so a migration
    # that drifts from the mapping fails at startup instead of at the first query.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        # Spring Boot 4 ships Jackson 3, where this feature moved from SerializationFeature to
        # DateTimeFeature. Timestamps go out as ISO-8601 strings, not epoch numbers.
        write-dates-as-timestamps: false

dashboard:
  quotes:
    yahoo:
      # Upstream calls are made on request threads, so this timeout bounds how long a quote request
      # can hang. Applied to the connect and to each individual call, including the cookie/crumb
      # handshake the quote endpoint requires.
      connection-timeout-millis: ${QUOTES_TIMEOUT_MS:10000}

    stream:
      # The realtime feed. One tick fetches the union of every connected client's symbols in a
      # single upstream call, so the cost is set by this interval, not by how many clients there
      # are. Nothing is fetched at all while nobody is subscribed.
      path: /ws/quotes
      interval-millis: ${QUOTES_STREAM_INTERVAL_MS:3000}
      # Public market data, no credentials: the feed is as open as the REST API. Narrow this when a
      # deployment needs it.
      allowed-origins: ${QUOTES_STREAM_ALLOWED_ORIGINS:*}
      # A client that stops reading is disconnected rather than allowed to back the feed up.
      send-time-limit-millis: 5000
      send-buffer-size-bytes: 524288

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are produced by GlobalExceptionHandler as RFC 9457 documents; the servlet container's
    # own error page must never add stack traces or messages of its own.
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  application:
    name: ${spring.application.name}
    description: Financial stock portfolio dashboard API

logging:
  level:
    root: INFO
    com.forinvest.dashboard: INFO
