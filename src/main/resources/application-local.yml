# Local development against the Postgres started by `docker compose up -d postgres`.
# Credentials here are throwaway values for a local container and are intentionally in git.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fin_dashboard
    username: dashboard
    password: dashboard
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.forinvest.dashboard: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
