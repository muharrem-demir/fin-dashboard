name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # One command runs the whole gate: spotless -> checkstyle -> unit tests -> integration
      # tests on Testcontainers -> spotbugs -> jacoco threshold. GitHub-hosted runners provide a
      # Docker daemon, so the integration tests really do run against PostgreSQL here.
      - name: Verify
        run: ./mvnw ${MAVEN_ARGS} clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      # The specification is generated from the code, so publishing it from CI keeps it in step
      # with what actually shipped — and lets the prod profile keep Swagger UI switched off.
      - name: Publish OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: target/openapi/
          retention-days: 30
          if-no-files-found: ignore

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Builds only — nothing is pushed. This exists so a broken Dockerfile fails a pull request
      # rather than a deployment.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fin-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker network create ci-net
          docker run -d --name pg --network ci-net \
            -e POSTGRES_DB=fin_dashboard \
            -e POSTGRES_USER=dashboard \
            -e POSTGRES_PASSWORD=dashboard \
            postgres:18-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U dashboard -d fin_dashboard && break
            sleep 2
          done

          docker run -d --name api --network ci-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e DB_HOST=pg \
            fin-dashboard:${{ github.sha }}

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become healthy" >&2
          docker logs api >&2
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f api pg 2>/dev/null || true
